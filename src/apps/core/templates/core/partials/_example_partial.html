<!-- Example HTMX Partial -->
<!-- Demonstrates: HTMX swap, touch targets >= 48x48dp, contrast >= 4.5:1, Alpine.js frontend validation -->

<div
    id="example-partial"
    x-data="exampleForm()"
    class="p-4 bg-white rounded-lg shadow"
>
    <h2 class="text-xl font-bold mb-2 text-gray-900">{{ result.message }}</h2>
    <p class="text-gray-600">User ID: {{ result.user_id }}</p>
    <p class="text-gray-600">Status: {{ result.status }}</p>

    <!-- Example Form with Dual Validation (Frontend + Backend) -->
    <form
        hx-post="/example/"
        hx-target="#example-partial"
        hx-swap="outerHTML"
        class="mt-4 space-y-4"
        @submit.prevent="validateAndSubmit()"
    >
        <!-- Title Field with Real-time Validation -->
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
                Título <span class="text-red-600">*</span>
            </label>
            <input
                type="text"
                id="title"
                name="title"
                x-model="title"
                @input="validateTitle()"
                required
                minlength="3"
                maxlength="200"
                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[48px]"
                :class="{
                    'border-red-500': titleError,
                    'border-gray-300': !titleError
                }"
                placeholder="Digite o título (mínimo 3 caracteres)"
            >
            <p x-show="titleError" x-text="titleError" class="mt-1 text-sm text-red-600" role="alert"></p>
        </div>

        <!-- Status Toggle (Radio Buttons, not Select) -->
        <fieldset class="space-y-2">
            <legend class="block text-sm font-medium text-gray-700 mb-1">Status</legend>
            <label class="flex items-center gap-3 min-h-[48px] cursor-pointer">
                <input
                    type="radio"
                    name="status"
                    value="active"
                    x-model="status"
                    class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500"
                >
                <span class="text-gray-700">Ativo</span>
            </label>
            <label class="flex items-center gap-3 min-h-[48px] cursor-pointer">
                <input
                    type="radio"
                    name="status"
                    value="inactive"
                    x-model="status"
                    class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500"
                >
                <span class="text-gray-700">Inativo</span>
            </label>
        </fieldset>

        <!-- Submit Button with Touch Target >= 48x48dp -->
        <button
            type="submit"
            :disabled="!isValid"
            class="w-full min-h-[48px] px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
            Salvar
        </button>
    </form>

    <!-- Refresh Button -->
    <button
        hx-get="/"
        hx-target="#example-partial"
        hx-swap="outerHTML"
        class="mt-4 w-full min-h-[48px] px-6 py-3 bg-gray-200 text-gray-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2"
    >
        Atualizar Dados
    </button>
</div>

<script>
    function exampleForm() {
        return {
            title: '',
            status: 'active',
            titleError: '',
            isValid: false,

            validateTitle() {
                if (!this.title) {
                    this.titleError = 'Título é obrigatório';
                } else if (this.title.length < 3) {
                    this.titleError = 'Título deve ter pelo menos 3 caracteres';
                } else {
                    this.titleError = '';
                }
                this.updateValidity();
            },

            updateValidity() {
                this.isValid = this.title.length >= 3 && !this.titleError;
            },

            validateAndSubmit() {
                this.validateTitle();
                if (this.isValid) {
                    this.$el.closest('form').requestSubmit();
                }
            }
        };
    }
</script>
