<!-- T015: PWA install banner — bottom sheet, Alpine-powered -->
<div x-data="{
    show: false,
    init() {
      if (localStorage.getItem('aef_pwa_installed')) return;
      var until = localStorage.getItem('aef_pwa_banner_dismissed_until');
      if (until && new Date(until) > new Date()) return;
      document.body.addEventListener('pwa:installable', () => { this.show = true });
      document.body.addEventListener('pwa:banner-dismissed', () => { this.show = false });
      document.body.addEventListener('pwa:installed', () => { this.show = false });
    }
  }"
  x-show="show"
  x-cloak
  class="fixed bottom-0 left-0 right-0 z-50 border-t border-surface-variant bg-surface p-4 shadow-lg sm:bottom-4 sm:left-auto sm:right-4 sm:w-80 sm:rounded-lg sm:border">
  <div class="flex items-center gap-3">
    <div class="flex-1">
      <p class="text-sm font-medium text-on-surface">Instalar App para registro rápido</p>
      <p class="mt-0.5 text-xs text-on-surface-variant">Adicione à tela inicial</p>
    </div>
    <button @click="window.showInstallPrompt()"
      class="rounded-full bg-primary px-3 py-1.5 text-xs font-semibold text-on-primary"
      style="min-height: 48px; min-width: 48px;">
      Instalar
    </button>
    <button @click="window.dismissInstallBanner()"
      class="ml-1 rounded-full p-2 text-on-surface-variant hover:bg-surface-variant"
      style="min-height: 48px; min-width: 48px;"
      aria-label="Fechar">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
